<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Foco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F3F8;
    --card: #FFFFFF;
    --ink: #14141F;
    --ink-soft: #8B8A99;
    --purple: #5B52E8;
    --purple-soft: #EDEBFF;
    --orange: #FF7A45;
    --orange-soft: #FFE7DB;
    --yellow: #E8A800;
    --yellow-soft: #FFF3D6;
    --green: #34B575;
    --green-soft: #DFF3E7;
    --border: #ECECF3;
    --shadow: 0 6px 20px rgba(20,20,31,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161C; --card: #232230; --ink: #F0EFF6; --ink-soft: #9B99AC;
      --purple-soft: #2E2A54; --orange-soft: #4A2E22; --yellow-soft: #4A3B1A; --green-soft: #1E3A2C;
      --border: #302F3B; --shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161C; --card: #232230; --ink: #F0EFF6; --ink-soft: #9B99AC;
    --purple-soft: #2E2A54; --orange-soft: #4A2E22; --yellow-soft: #4A3B1A; --green-soft: #1E3A2C;
    --border: #302F3B; --shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 100px; max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 1.7rem; font-weight: 800; margin: 0; line-height: 1.15; }
  .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 6px 0 20px; font-weight: 500; }

  .datestrip { display:flex; gap: 8px; overflow-x:auto; margin-bottom: 24px; padding-bottom: 2px; }
  .datepill {
    min-width: 52px; padding: 10px 6px; border-radius: 16px; text-align:center;
    background: var(--card); border: 1px solid var(--border); flex-shrink:0;
  }
  .datepill .dnum { font-weight: 800; font-size: 1rem; }
  .datepill .dlbl { font-size: 0.68rem; color: var(--ink-soft); font-weight: 600; }
  .datepill.active { background: var(--purple); }
  .datepill.active .dnum, .datepill.active .dlbl { color: #fff; }

  .sectiontitle {
    font-size: 1.05rem; font-weight: 800; margin: 26px 0 10px; display:flex;
    justify-content:space-between; align-items:center;
  }
  .sectiontitle:first-of-type { margin-top: 8px; }

  .togglebtn {
    flex: 1; padding: 13px; border-radius: 14px; border: 1px solid var(--border);
    font-weight: 700; font-size: 0.88rem; cursor: pointer; background: var(--bg); color: var(--ink);
    font-family: inherit;
  }
  .togglebtn.active-green { background: var(--green); color: #fff; border-color: var(--green); }
  .togglebtn.active-orange { background: var(--orange); color: #fff; border-color: var(--orange); }
  .togglebtn.active-red { background: #E85D5D; color: #fff; border-color: #E85D5D; }

  .statrow { display:flex; gap: 12px; }
  .statcard {
    flex:1; border-radius: 22px; padding: 16px; color: #fff; min-height: 118px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .statcard .lbl { font-size: 0.78rem; font-weight: 600; opacity: 0.9; }
  .statcard .num { font-size: 1.9rem; font-weight: 800; }
  .sc-purple { background: linear-gradient(160deg, var(--purple), #7A72F0); }
  .sc-orange { background: linear-gradient(160deg, var(--orange), #FF9A6C); }
  .sc-yellow { background: linear-gradient(160deg, var(--yellow-soft) 0%, #FFC53D 120%); color:#5A4200; }

  .card {
    background: var(--card); border-radius: 22px; padding: 18px;
    border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 6px;
  }

  .goalrow { display:flex; align-items:center; gap: 12px; }
  .goalicon {
    width: 46px; height: 46px; border-radius: 14px; background: var(--purple-soft);
    display:flex; align-items:center; justify-content:center; font-size: 1.3rem; flex-shrink:0;
  }
  .goaltitle { font-weight: 800; font-size: 1rem; }
  .goalsub { color: var(--ink-soft); font-size: 0.82rem; font-weight: 500; margin-top:1px; }
  .progresswrap { margin-top: 14px; }
  .pbar { height: 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); overflow:hidden; margin-top: 5px; }
  .pfill { height: 100%; border-radius: 6px; }
  .pfill.purple { background: var(--purple); }
  .pfill.orange { background: var(--orange); }
  .plabel { font-size: 0.76rem; color: var(--ink-soft); font-weight: 600; display:flex; justify-content:space-between; }

  .rewardbox { margin-top: 16px; }
  .rewardbox label { font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); }
  .rewardbox input[type=text] {
    width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 0.9rem; font-weight: 600;
  }
  .claimbtn {
    margin-top: 14px; width: 100%; padding: 13px; border-radius: 16px; border: none;
    font-weight: 800; font-size: 0.92rem; cursor: pointer;
  }
  .claimbtn.ready { background: var(--green); color: #fff; }
  .claimbtn.notready { background: var(--bg); color: var(--ink-soft); border: 1px solid var(--border); }
  .claimbtn.claimed { background: var(--purple-soft); color: var(--purple); }

  .catscroll { display:flex; gap: 12px; overflow-x:auto; overflow-y:visible; padding: 6px 4px 14px 4px; margin: -6px -4px 0; }
  .catcard {
    min-width: 108px; background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 14px; flex-shrink:0; box-shadow: var(--shadow); cursor:pointer;
  }
  .catcard.addnew { display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--ink-soft); }
  .caticon {
    width: 40px; height: 40px; border-radius: 12px; display:flex; align-items:center;
    justify-content:center; font-size: 1.15rem; margin-bottom: 10px;
  }
  .catcard .cname { font-weight: 700; font-size: 0.84rem; line-height: 1.2; }
  .catbar { height: 5px; border-radius: 4px; margin-top: 10px; background: var(--bg); }
  .catcard.active { outline: 2px solid var(--purple); }

  .waterwrap { display:flex; align-items:center; gap: 14px; }
  .wbtn {
    width: 46px; height: 46px; border-radius: 14px; background: var(--orange-soft); color: var(--orange);
    border: none; font-size: 1.3rem; font-weight: 800; cursor: pointer;
  }
  .wmid { flex:1; }

  .daylist { display:flex; flex-direction:column; gap: 10px; margin-top: 4px; }
  .dayrow { display:flex; align-items:center; gap: 12px; padding: 10px 4px; }
  .daycircle {
    width: 46px; height: 46px; border-radius: 50%; display:flex; align-items:center;
    justify-content:center; font-weight: 800; font-size: 0.88rem; flex-shrink:0; color:#fff;
  }
  .dayinfo { flex:1; }
  .dayname { font-weight: 700; font-size: 0.92rem; }
  .daystatus { font-size: 0.78rem; color: var(--ink-soft); font-weight: 500; }
  .daycheck { font-size: 1.2rem; }

  textarea {
    width: 100%; min-height: 90px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink); padding: 12px; font-size: 0.88rem;
    font-family: inherit; resize: vertical; margin-top: 8px;
  }
  .hint { font-size: 0.75rem; color: var(--ink-soft); margin-top: 8px; }

  .bottomnav {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 528px; background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; box-shadow: var(--shadow); display:flex; justify-content:space-around;
    padding: 12px 8px;
  }
  .navitem { display:flex; flex-direction:column; align-items:center; gap: 4px; cursor:pointer; background:none; border:none; padding: 4px 10px; }
  .navicon { font-size: 1.2rem; color: var(--ink-soft); }
  .navlabel { font-size: 0.68rem; font-weight: 700; color: var(--ink-soft); }
  .navitem.active .navicon, .navitem.active .navlabel { color: var(--purple); }
  .navdot { width: 5px; height: 5px; border-radius: 50%; background: var(--orange); opacity: 0; }
  .navitem.active .navdot { opacity: 1; }

  .warnbanner {
    display:none; background: #FBE4E1; color: #7A2E24; border: 1px solid #E8A79C;
    border-radius: 16px; padding: 14px 16px; font-size: 0.84rem; font-weight: 600;
    line-height: 1.4; margin-bottom: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .warnbanner { background: #3A241F; color: #F2C4B8; border-color: #6B3A2E; }
  }
  :root[data-theme="dark"] .warnbanner { background: #3A241F; color: #F2C4B8; border-color: #6B3A2E; }
</style>
</head>
<body>

<div class="warnbanner" id="storageWarning"></div>

<div id="page-home">

<h1 id="greeting"></h1>
<div class="sub" id="dateLine"></div>

<div class="datestrip" id="dateStrip"></div>

<div class="statrow" id="statRow"></div>

<div class="sectiontitle" style="margin-top:4px;"><span>Doce hoje</span></div>
<div class="card">
  <div style="display:flex; gap:10px;">
    <button id="doceYes" class="togglebtn">✅ Resisti</button>
    <button id="doceNo" class="togglebtn">🍫 Comi doce</button>
  </div>
</div>

<div class="sectiontitle"><span>Dieta hoje</span></div>
<div class="card">
  <div style="display:flex; gap:10px;">
    <button id="dietaYes" class="togglebtn">✅ Segui</button>
    <button id="dietaNo" class="togglebtn">❌ Não segui</button>
  </div>
</div>

<div class="sectiontitle"><span>Treino de hoje</span></div>
<div class="catscroll" id="catScroll"></div>

<div class="sectiontitle"><span>Água</span></div>
<div class="card">
  <div class="sub" style="margin:0 0 12px;" id="waterText"></div>
  <div class="pbar" style="margin-bottom:14px;"><div class="pfill orange" id="waterFill"></div></div>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="togglebtn waterquick" data-ml="100" style="flex:none; padding:10px 14px;">+100ml</button>
    <button class="togglebtn waterquick" data-ml="250" style="flex:none; padding:10px 14px;">+250ml</button>
    <button class="togglebtn waterquick" data-ml="650" style="flex:none; padding:10px 14px;">+650ml (garrafa)</button>
  </div>
  <div style="display:flex; gap:8px; margin-top:10px;">
    <input type="number" id="customWaterInput" placeholder="outra quantidade em ml" min="0"
      style="flex:1; padding:12px 14px; border-radius:14px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font-family:inherit; font-size:0.88rem;">
    <button id="customWaterAdd" class="togglebtn" style="flex:none; padding:12px 18px;">Adicionar</button>
  </div>
  <div class="hint" id="resetWaterToday" style="margin-top:10px; cursor:pointer; text-decoration:underline;">Zerar hoje</div>
</div>

<div class="sectiontitle"><span>Meta da semana</span></div>
<div class="card" id="goalCard"></div>

<div class="sectiontitle"><span>Semana</span></div>
<div class="card">
  <div class="daylist" id="dayList"></div>
</div>

<div class="sectiontitle"><span>Backup</span></div>
<div class="card">
  <div class="sub" style="margin:0 0 14px;">Salve um arquivo com seus dados de vez em quando, pra não perder nada se trocar de navegador ou celular.</div>
  <div style="display:flex; gap:10px;">
    <button id="exportBtn" class="togglebtn">⬇️ Exportar dados</button>
    <button id="importBtn" class="togglebtn">⬆️ Importar dados</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none;">
  <div class="hint" id="backupMsg" style="margin-top:10px;"></div>
</div>

</div>

<div id="page-history" style="display:none;">

<h1>Histórico</h1>
<div class="sub">Suas semanas, mês a mês.</div>

<div id="historyContent"></div>

</div>

<div class="bottomnav">
  <button class="navitem active" data-page="home"><div class="navdot"></div><div class="navicon">📔</div><div class="navlabel">Diário</div></button>
  <button class="navitem" data-page="history"><div class="navdot"></div><div class="navicon">📊</div><div class="navlabel">Histórico</div></button>
</div>

<script>
const STORAGE_KEY = 'meufoco_data_v3';
const WATER_UNIT_ML = 650;
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DIAS_LONG = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function storageAvailable(){
  try {
    const t = '__meufoco_test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return true;
  } catch(e){ return false; }
}
if(!storageAvailable()){
  const warn = document.getElementById('storageWarning');
  warn.style.display = 'block';
  warn.textContent = '⚠️ Seus dados não estão sendo salvos neste navegador agora. Isso costuma acontecer em modo anônimo/privado, ou quando o link é aberto por dentro de outro app (WhatsApp, Instagram). Copie o link e abra direto no Safari ou Chrome pra funcionar certinho.';
}


function isoDate(d){ return d.toISOString().slice(0,10); }
function getMonday(d){
  const date = new Date(d); const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate()+diff); date.setHours(0,0,0,0);
  return date;
}

let state = loadState();
function loadState(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); } catch(e){}
  return { days: {}, dietText: '', workoutGoal: 5, sugarFreeGoal: 4, reward: '', claimedWeeks: {} };
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function getDay(iso){ if(!state.days[iso]) state.days[iso] = { doce:null, water:0, workout:null, dieta:null }; return state.days[iso]; }

const today = new Date();
const todayIso = isoDate(today);
const monday = getMonday(today);
const weekIsos = [];
for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(d.getDate()+i); weekIsos.push(isoDate(d)); }
const weekKey = weekIsos[0];

document.getElementById('greeting').textContent = 'Oi, Manu';
document.getElementById('dateLine').textContent = today.toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'});

const stripBox = document.getElementById('dateStrip');
weekIsos.forEach((iso,i)=>{
  const d = new Date(iso+'T00:00:00');
  const pill = document.createElement('div');
  pill.className = 'datepill' + (iso===todayIso ? ' active' : '');
  pill.innerHTML = '<div class="dnum">'+d.getDate()+'</div><div class="dlbl">'+DIAS[i]+'</div>';
  stripBox.appendChild(pill);
});

function isSunday(iso){ return new Date(iso+'T00:00:00').getDay()===0; }
function isSaturday(iso){ return new Date(iso+'T00:00:00').getDay()===6; }

function weekStats(){
  let workoutDays=0, sugarFreeWeekdays=0, waterToday=getDay(todayIso).water;
  weekIsos.forEach(iso=>{
    const d = state.days[iso];
    if(!d) return;
    if(d.workout && d.workout!=='Descanso') workoutDays++;
    const isWknd = isSunday(iso) || isSaturday(iso);
    if(!isWknd && d.doce===true) sugarFreeWeekdays++;
  });
  return {workoutDays, sugarFreeWeekdays, waterToday};
}

function renderStats(){
  const s = weekStats();
  const row = document.getElementById('statRow'); row.innerHTML='';
  const items = [
    {cls:'sc-purple', lbl:'Sem doce (dias úteis)', num: s.sugarFreeWeekdays},
    {cls:'sc-orange', lbl:'Treinos na semana', num: s.workoutDays+'/'+state.workoutGoal},
    {cls:'sc-yellow', lbl:'Água hoje', num: s.waterToday+' ml', small:true}
  ];
  items.forEach(it=>{
    const el = document.createElement('div');
    el.className = 'statcard '+it.cls;
    el.innerHTML = '<div class="lbl">'+it.lbl+'</div><div class="num" style="'+(it.small?'font-size:1.5rem;':'')+'">'+it.num+'</div>';
    row.appendChild(el);
  });
}

function renderGoalCard(){
  const s = weekStats();
  const workoutPct = Math.min(100, (s.workoutDays/state.workoutGoal)*100);
  const sugarPct = Math.min(100, (s.sugarFreeWeekdays/state.sugarFreeGoal)*100);
  const met = s.workoutDays >= state.workoutGoal && s.sugarFreeWeekdays >= state.sugarFreeGoal;
  const claimed = !!state.claimedWeeks[weekKey];

  const box = document.getElementById('goalCard');
  box.innerHTML = `
    <div class="goalrow">
      <div class="goalicon">🎯</div>
      <div>
        <div class="goaltitle">Bata a meta e ganhe sua recompensa</div>
        <div class="goalsub">${state.workoutGoal} treinos + ${state.sugarFreeGoal} dias sem doce (seg a sex)</div>
      </div>
    </div>
    <div class="progresswrap">
      <div class="plabel"><span>Treinos</span><span>${s.workoutDays}/${state.workoutGoal}</span></div>
      <div class="pbar"><div class="pfill orange" style="width:${workoutPct}%"></div></div>
    </div>
    <div class="progresswrap">
      <div class="plabel"><span>Sem doce</span><span>${s.sugarFreeWeekdays}/${state.sugarFreeGoal}</span></div>
      <div class="pbar"><div class="pfill purple" style="width:${sugarPct}%"></div></div>
    </div>
    <div class="rewardbox">
      <label>Sua recompensa se bater a meta</label>
      <input type="text" id="rewardInput" placeholder="ex: um doce top no fim de semana, ou comprar algo" value="${(state.reward||'').replace(/"/g,'&quot;')}">
    </div>
    <button class="claimbtn ${claimed ? 'claimed' : (met ? 'ready' : 'notready')}" id="claimBtn">
      ${claimed ? '✓ Recompensa resgatada essa semana' : (met ? '🎉 Meta batida — resgatar recompensa' : 'Ainda não bateu a meta essa semana')}
    </button>
  `;
  document.getElementById('rewardInput').addEventListener('input', (e)=>{
    state.reward = e.target.value; saveState();
  });
  const btn = document.getElementById('claimBtn');
  if(met && !claimed){
    btn.onclick = ()=>{ state.claimedWeeks[weekKey]=true; saveState(); renderAll(); };
  } else if (claimed) {
    btn.onclick = ()=>{ delete state.claimedWeeks[weekKey]; saveState(); renderAll(); };
  }
}

const BASE_COLORS = ['purple-soft','orange-soft','green-soft','yellow-soft'];
const BASE_FG = ['purple','orange','green','yellow'];

function renderCats(){
  const d = getDay(todayIso);
  const sunday = isSunday(todayIso);
  let opts = sunday
    ? [{name:'Caminhada', icon:'🚶'}, {name:'Bike', icon:'🚴'}, {name:'Alongamento', icon:'🧘'}, {name:'Descanso', icon:'😴'}]
    : [{name:'Academia', icon:'🏋️'}, {name:'Caminhada', icon:'🚶'}, {name:'Bike', icon:'🚴'}, {name:'Alongamento', icon:'🧘'}, {name:'Dança', icon:'💃'}, {name:'Descanso', icon:'😴'}];
  (state.customWorkoutTypes || []).forEach(name=>{
    if(!opts.find(o=>o.name===name)) opts.push({name, icon:'⭐'});
  });
  const box = document.getElementById('catScroll'); box.innerHTML='';
  opts.forEach((o,i)=>{
    const active = d.workout === o.name;
    const color = BASE_COLORS[i % BASE_COLORS.length];
    const fg = BASE_FG[i % BASE_FG.length];
    const card = document.createElement('div');
    card.className = 'catcard' + (active ? ' active' : '');
    card.innerHTML = `<div class="caticon" style="background:var(--${color});color:var(--${fg})">${o.icon}</div>
      <div class="cname">${o.name}</div>
      <div class="catbar" style="background:${active ? 'var(--'+fg+')' : 'var(--bg)'}"></div>`;
    card.onclick = ()=>{ d.workout = active ? null : o.name; saveState(); renderAll(); };
    box.appendChild(card);
  });
  const addCard = document.createElement('div');
  addCard.className = 'catcard addnew';
  addCard.innerHTML = `<div class="caticon" style="background:var(--bg);color:var(--ink-soft);font-size:1.4rem;">＋</div><div class="cname">Novo</div>`;
  addCard.onclick = ()=>{
    const name = prompt('Nome do novo tipo de treino:');
    if(name && name.trim()){
      const clean = name.trim();
      if(!state.customWorkoutTypes) state.customWorkoutTypes = [];
      if(!state.customWorkoutTypes.includes(clean)) state.customWorkoutTypes.push(clean);
      saveState(); renderAll();
    }
  };
  box.appendChild(addCard);
}

function renderWater(){
  const d = getDay(todayIso);
  const softRef = WATER_UNIT_ML * 4; // só referência visual, sem cobrança
  const pct = Math.min(100, (d.water/softRef)*100);
  document.getElementById('waterFill').style.width = pct+'%';
  document.getElementById('waterText').textContent = d.water + ' ml hoje';
}
document.querySelectorAll('.waterquick').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    getDay(todayIso).water += Number(btn.dataset.ml);
    saveState(); renderAll();
  });
});
document.getElementById('customWaterAdd').addEventListener('click', ()=>{
  const input = document.getElementById('customWaterInput');
  const val = parseInt(input.value, 10);
  if(val && val > 0){
    getDay(todayIso).water += val;
    saveState(); renderAll();
  }
  input.value = '';
});
document.getElementById('resetWaterToday').addEventListener('click', ()=>{
  getDay(todayIso).water = 0;
  saveState(); renderAll();
});

function renderDayList(){
  const box = document.getElementById('dayList'); box.innerHTML='';
  const colors = ['purple','orange','yellow','green'];
  weekIsos.forEach((iso,i)=>{
    const d = state.days[iso];
    const row = document.createElement('div');
    row.className = 'dayrow';
    const isToday = iso===todayIso;
    const color = colors[i % colors.length];
    let statusText = 'Sem registro';
    if(d){
      const parts = [];
      if(d.doce===true) parts.push('resistiu ao doce');
      else if(d.doce===false) parts.push('comeu doce');
      if(d.dieta===true) parts.push('seguiu a dieta');
      else if(d.dieta===false) parts.push('não seguiu a dieta');
      if(d.workout) parts.push(d.workout.toLowerCase());
      if(parts.length) statusText = parts.join(' · ');
    }
    row.innerHTML = `
      <div class="daycircle" style="background:var(--${color})">${DIAS[i]}</div>
      <div class="dayinfo">
        <div class="dayname">${DIAS_LONG[i]}${isToday ? ' (hoje)' : ''}</div>
        <div class="daystatus">${statusText}</div>
      </div>
      <div class="daycheck">${d && d.doce===true ? '✅' : (d && d.workout && d.workout!=='Descanso' ? '💪' : '')}</div>
    `;
    box.appendChild(row);
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'meufoco-backup-' + todayIso + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const msg = document.getElementById('backupMsg');
  msg.textContent = 'Arquivo baixado. Guarde ele em algum lugar seguro.';
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  const msg = document.getElementById('backupMsg');
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(typeof parsed !== 'object' || !parsed.days){
        msg.textContent = 'Esse arquivo não parece um backup do Meu Foco.';
        return;
      }
      state = parsed;
      saveState();
      renderAll();
      msg.textContent = 'Dados restaurados com sucesso.';
    } catch(err){
      msg.textContent = 'Não consegui ler esse arquivo. Confira se é o backup certo.';
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.querySelectorAll('.navitem').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.navitem').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const page = btn.dataset.page;
    document.getElementById('page-home').style.display = page==='home' ? '' : 'none';
    document.getElementById('page-history').style.display = page==='history' ? '' : 'none';
    if(page==='history') renderHistory();
    window.scrollTo({top:0, behavior:'instant'});
  });
});

function mondayOf(iso){
  return isoDate(getMonday(new Date(iso+'T00:00:00')));
}

function renderHistory(){
  const weekMap = {};
  Object.keys(state.days).forEach(iso=>{
    const wk = mondayOf(iso);
    if(!weekMap[wk]) weekMap[wk] = true;
  });
  const weekKeys = Object.keys(weekMap).sort((a,b)=> b.localeCompare(a));

  const box = document.getElementById('historyContent');
  if(weekKeys.length === 0){
    box.innerHTML = '<div class="card"><div class="sub" style="margin:0;">Ainda não há semanas registradas. Continue marcando os dias pra ver seu histórico aqui.</div></div>';
    return;
  }

  const byMonth = {};
  weekKeys.forEach(wk=>{
    const d = new Date(wk+'T00:00:00');
    const key = d.getFullYear()+'-'+d.getMonth();
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(wk);
  });

  const todayD = new Date(todayIso+'T00:00:00');
  const currentMonthKey = todayD.getFullYear()+'-'+todayD.getMonth();

  let html = '';
  Object.keys(byMonth).sort((a,b)=>{
    const [ay,am] = a.split('-').map(Number);
    const [by,bm] = b.split('-').map(Number);
    return (by*12+bm) - (ay*12+am);
  }).forEach(monthKey=>{
    const [y,m] = monthKey.split('-').map(Number);
    html += '<div class="sectiontitle" style="margin-top:26px;"><span>'+MESES[m]+' de '+y+'</span></div>';
    if(monthKey === currentMonthKey){
      byMonth[monthKey].forEach(wk=>{ html += renderWeekCard(wk); });
    } else {
      html += renderMonthSummary(monthKey, byMonth[monthKey]);
    }
  });
  box.innerHTML = html;
}

function renderMonthSummary(monthKey, weeks){
  let weeksMet = 0, totalWorkout = 0, totalSugarFree = 0, weeksClaimed = 0;
  weeks.forEach(wk=>{
    const isos = [];
    const start = new Date(wk+'T00:00:00');
    for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); isos.push(isoDate(d)); }
    let workoutDays=0, sugarFreeWeekdays=0;
    isos.forEach(iso=>{
      const d = state.days[iso];
      if(!d) return;
      if(d.workout && d.workout!=='Descanso') workoutDays++;
      const wknd = isSunday(iso) || isSaturday(iso);
      if(!wknd && d.doce===true) sugarFreeWeekdays++;
    });
    totalWorkout += workoutDays;
    totalSugarFree += sugarFreeWeekdays;
    if(workoutDays >= state.workoutGoal && sugarFreeWeekdays >= state.sugarFreeGoal) weeksMet++;
    if(state.claimedWeeks[wk]) weeksClaimed++;
  });
  const totalWeeks = weeks.length;
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="goalrow">
        <div class="goalicon" style="background:${weeksMet>0 ? 'var(--green-soft)' : 'var(--purple-soft)'};color:${weeksMet>0 ? 'var(--green)' : 'var(--purple)'}">📅</div>
        <div style="flex:1;">
          <div class="goaltitle">${weeksMet} de ${totalWeeks} semana${totalWeeks>1?'s':''} com meta batida</div>
          <div class="goalsub">${totalWorkout} treinos · ${totalSugarFree} dias sem doce no total${weeksClaimed>0 ? ' · '+weeksClaimed+' recompensa'+(weeksClaimed>1?'s':'')+' resgatada'+(weeksClaimed>1?'s':'') : ''}</div>
        </div>
      </div>
    </div>
  `;
}

function renderWeekCard(wkMonday){
  const isos = [];
  const start = new Date(wkMonday+'T00:00:00');
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); isos.push(isoDate(d)); }
  let workoutDays=0, sugarFreeWeekdays=0, dietaFollowed=0, dietaTotal=0;
  isos.forEach(iso=>{
    const d = state.days[iso];
    if(!d) return;
    if(d.workout && d.workout!=='Descanso') workoutDays++;
    const wknd = isSunday(iso) || isSaturday(iso);
    if(!wknd && d.doce===true) sugarFreeWeekdays++;
    if(d.dieta===true){ dietaFollowed++; dietaTotal++; }
    else if(d.dieta===false){ dietaTotal++; }
  });
  const met = workoutDays >= state.workoutGoal && sugarFreeWeekdays >= state.sugarFreeGoal;
  const claimed = !!state.claimedWeeks[wkMonday];
  const endDate = new Date(start); endDate.setDate(endDate.getDate()+6);
  const range = start.getDate()+' a '+endDate.getDate()+' de '+MESES[endDate.getMonth()];

  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="goalrow" style="margin-bottom:12px;">
        <div class="goalicon" style="background:${met ? 'var(--green-soft)' : 'var(--purple-soft)'};color:${met ? 'var(--green)' : 'var(--purple)'}">${met ? '🎉' : '📆'}</div>
        <div style="flex:1;">
          <div class="goaltitle">${range}</div>
          <div class="goalsub">${met ? (claimed ? 'Meta batida · recompensa resgatada' : 'Meta batida') : 'Meta não batida'}</div>
        </div>
      </div>
      <div class="plabel"><span>Treinos</span><span>${workoutDays}/${state.workoutGoal}</span></div>
      <div class="pbar"><div class="pfill orange" style="width:${Math.min(100,(workoutDays/state.workoutGoal)*100)}%"></div></div>
      <div class="plabel" style="margin-top:10px;"><span>Sem doce (dias úteis)</span><span>${sugarFreeWeekdays}/${state.sugarFreeGoal}</span></div>
      <div class="pbar"><div class="pfill purple" style="width:${Math.min(100,(sugarFreeWeekdays/state.sugarFreeGoal)*100)}%"></div></div>
      ${dietaTotal>0 ? '<div class="plabel" style="margin-top:10px;"><span>Dieta seguida</span><span>'+dietaFollowed+'/'+dietaTotal+' dias marcados</span></div>' : ''}
    </div>
  `;
}

function wireDoceButtons(){
  const d = getDay(todayIso);
  const yesBtn = document.getElementById('doceYes');
  const noBtn = document.getElementById('doceNo');
  yesBtn.classList.toggle('active-green', d.doce===true);
  noBtn.classList.toggle('active-orange', d.doce===false);
  yesBtn.onclick = ()=>{ d.doce = d.doce===true ? null : true; saveState(); renderAll(); };
  noBtn.onclick = ()=>{ d.doce = d.doce===false ? null : false; saveState(); renderAll(); };
}

function wireDietaButtons(){
  const d = getDay(todayIso);
  const yesBtn = document.getElementById('dietaYes');
  const noBtn = document.getElementById('dietaNo');
  yesBtn.classList.toggle('active-green', d.dieta===true);
  noBtn.classList.toggle('active-red', d.dieta===false);
  yesBtn.onclick = ()=>{ d.dieta = d.dieta===true ? null : true; saveState(); renderAll(); };
  noBtn.onclick = ()=>{ d.dieta = d.dieta===false ? null : false; saveState(); renderAll(); };
}

function renderAll(){
  renderStats();
  renderGoalCard();
  renderCats();
  renderWater();
  renderDayList();
  wireDoceButtons();
  wireDietaButtons();
}
renderAll();
</script>
